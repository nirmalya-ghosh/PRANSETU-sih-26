name: Android Build & Release APK

on:
  push:
    branches:
      - main
      - feature/*
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/PRANSETU/gradlew

      - name: Build Debug APK
        run: |
          cd android/PRANSETU
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRANSETU-debug-apk
          path: android/PRANSETU/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
